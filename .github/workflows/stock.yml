name: Daily Stock
on:
  schedule:
    - cron: '30 0 * * *'  # UTC 00:30 = KST 09:30
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    env:
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      HERMES_MODEL: google/gemini-2.5-flash
      HERMES_PROVIDER: google
    steps:
      - name: Install Hermes
        run: curl -fsSL https://hermes-agent.nousresearch.com/install.sh | bash

      - name: Configure Hermes Model
        run: |
          hermes config set model.default google/gemini-2.5-flash
          hermes config set model.provider google
          hermes config set model.base_url https://generativelanguage.googleapis.com/v1beta

      - name: Run Stock Analysis
        run: hermes chat -q "stock-analysis 스킬로 10종목 분석"

      - name: Send Telegram Notification
        uses: appleboy/telegram-action@v1.1.1
        with:
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          message: "📊 일일 주식 리포트 완료"
          format: markdown
